<!DOCTYPE html>
<html>
<head>
    <title>Eliminar Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .btn-yes { background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .warning { background: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="warning">
        <h1>Eliminar Producto</h1>
        <p>¿Estás seguro de que deseas eliminar <strong>"{{ product.name }}"</strong>?</p>
        <p>Esta acción no se puede deshacer.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-yes">Sí, eliminar</button>
        <a href="{% url 'store:product_detail' product.pk %}" class="btn-cancel">Cancelar</a>
    </form>
</body>
</html>
