<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}Editar{% else %}Agregar{% endif %} Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        form p { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .btn-save { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .errorlist { color: #dc3545; list-style: none; padding: 0; }
    </style>
</head>
<body>
    <a href="{% url 'store:product_list' %}">Volver al Catálogo</a>
    <h1>{% if form.instance.pk %}Editar{% else %}Agregar{% endif %} Producto</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-save">Guardar</button>
        <a href="{% url 'store:product_list' %}" class="btn-cancel">Cancelar</a>
    </form>
</body>
</html>
