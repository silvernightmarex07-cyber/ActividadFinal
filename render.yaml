services:
  - type: web
    name: actividadfinal
    runtime: python
    rootDir: djangotutorial
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn mysite.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: actividadfinal-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: actividadfinal-db
    databaseName: tienda
    plan: free
